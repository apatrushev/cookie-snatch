[package]
name = "cookie-snatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Capture a website's session cookies by driving an already-installed browser over CDP or WebDriver BiDi."
keywords = ["cookies", "cdp", "webdriver", "bidi", "session"]
categories = ["web-programming", "authentication", "command-line-utilities"]
readme = "README.md"
license = "MIT OR Apache-2.0"
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
which = "8"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
anyhow = "1"
rstest = "0.26"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
fallible_impl_from = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
if_not_else = "deny"
needless_continue = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"
